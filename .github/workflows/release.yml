name: release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "release-${{ github.ref }}", cancel-in-progress: false }
jobs:
  version:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      alpha: ${{ steps.tag.outputs.alpha }}
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - id: tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(bun apps/desktop/scripts/version.ts get)"; fi
          bun apps/desktop/scripts/version.ts check "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "alpha=$([[ "$TAG" == *-alpha.* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: notes
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ steps.tag.outputs.tag }}" }
        run: |
          INSTALL=$(sed -n '/<!-- release-start -->/,/<!-- release-end -->/p' docs/installation.md | sed '1d;$d')
          if [ -z "$INSTALL" ]; then echo "docs/installation.md has no release block" >&2; exit 1; fi
          CHANGES=$(bun apps/desktop/scripts/changelog.ts section "${TAG#v}")
          GENERATED=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body)
          {
            echo 'body<<KIBO_NOTES'
            echo "$INSTALL"
            echo
            echo "## Nouveautés"
            echo
            echo "$CHANGES"
            echo
            echo "## Détail des changements"
            echo
            echo "$GENERATED"
            echo 'KIBO_NOTES'
          } >> "$GITHUB_OUTPUT"
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/ui build
      - uses: actions/upload-artifact@v5
        with:
          name: ui-dist
          path: packages/ui/dist
          if-no-files-found: error
  build:
    needs: [version, ui]
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: release-${{ matrix.target }}
          save-if: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with: { name: ui-dist, path: packages/ui/dist }
      - run: bun apps/desktop/scripts/build-sidecar.ts
      - name: Importer le certificat de signature
        if: runner.os == 'macOS' && env.MACOS_SIGNING_P12 != ''
        shell: bash
        run: |
          case "$MACOS_SIGNING_P12" in *[[:space:]]*) echo "MACOS_SIGNING_P12 must be base64 on a single line" >&2; exit 1 ;; esac
          KEYCHAIN="$RUNNER_TEMP/kibo-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/kibo-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/kibo-signing.p12" -k "$KEYCHAIN" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security find-certificate -c "Kibo Code Signing" -p "$KEYCHAIN" > "$RUNNER_TEMP/kibo-signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/kibo-signing.pem"
          rm -f "$RUNNER_TEMP/kibo-signing.p12"
          {
            echo "APPLE_CERTIFICATE=$MACOS_SIGNING_P12"
            echo "APPLE_CERTIFICATE_PASSWORD=$MACOS_SIGNING_P12_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=Kibo Code Signing"
          } >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Kibo ${{ needs.version.outputs.tag }}
          releaseBody: ${{ needs.version.outputs.notes }}
          releaseDraft: true
          prerelease: ${{ needs.version.outputs.alpha == 'true' }}
          uploadUpdaterJson: true
          args: --target ${{ matrix.target }} --verbose
      - name: Supprimer le trousseau de signature
        if: always() && runner.os == 'macOS' && env.MACOS_SIGNING_P12 != ''
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/kibo-signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN"; fi
  checksums:
    needs: [version, build]
    permissions: { contents: write }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ needs.version.outputs.tag }}" }
        shell: bash
        run: |
          cp apps/desktop/src-tauri/icons/icon.png icon-512.png
          gh release upload "$TAG" icon-512.png --clobber
          gh release download "$TAG" -D dist --pattern '*'
          rm -f dist/SHA256SUMS dist/install.sh
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release upload "$TAG" dist/SHA256SUMS scripts/install/install.sh --clobber
  publish:
    needs: [version, build, checksums]
    permissions: { contents: write }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ needs.version.outputs.tag }}", ALPHA: "${{ needs.version.outputs.alpha }}" }
        shell: bash
        run: |
          if [ "$ALPHA" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
            gh release view alpha >/dev/null 2>&1 || gh release create alpha --prerelease --latest=false --title "Kibo alpha · canal de mise à jour" --notes "Actifs du canal alpha : latest.json, SHA256SUMS, install.sh. Les paquets sont sur la release de chaque version." --target "$GITHUB_SHA"
            gh release download "$TAG" -D alpha --pattern 'latest.json' --pattern 'SHA256SUMS' --pattern 'install.sh' --pattern 'icon-512.png'
            gh release upload alpha alpha/latest.json alpha/SHA256SUMS alpha/install.sh alpha/icon-512.png --clobber
          else
            gh release edit "$TAG" --draft=false --latest
          fi
