name: release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      skipIntel:
        description: "Ne pas construire macOS Intel (essai)"
        type: boolean
        default: false
permissions: { contents: read }
concurrency: { group: "release-${{ github.ref }}", cancel-in-progress: false }
jobs:
  version:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      alpha: ${{ steps.tag.outputs.alpha }}
      notes: ${{ steps.notes.outputs.body }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - id: tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(bun apps/desktop/scripts/version.ts get)"; fi
          bun apps/desktop/scripts/version.ts check "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "alpha=$([[ "$TAG" == *-alpha.* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: notes
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ steps.tag.outputs.tag }}" }
        run: |
          INSTALL=$(sed -n '/<!-- release-start -->/,/<!-- release-end -->/p' docs/installation.md | sed '1d;$d')
          if [ -z "$INSTALL" ]; then echo "docs/installation.md has no release block" >&2; exit 1; fi
          CHANGES=$(bun apps/desktop/scripts/changelog.ts section "${TAG#v}")
          GENERATED=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body)
          {
            echo 'body<<KIBO_NOTES'
            echo "$INSTALL"
            echo
            echo "## Nouveautés"
            echo
            echo "$CHANGES"
            echo
            echo "## Détail des changements"
            echo
            echo "$GENERATED"
            echo 'KIBO_NOTES'
          } >> "$GITHUB_OUTPUT"
      - id: matrix
        shell: bash
        env: { SKIP_INTEL: "${{ inputs.skipIntel }}" }
        run: |
          MATRIX='{"os":"macos-latest","target":"aarch64-apple-darwin"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}'
          if [ "$SKIP_INTEL" != "true" ]; then MATRIX="$MATRIX,"'{"os":"macos-15-intel","target":"x86_64-apple-darwin"}'; fi
          echo "matrix={\"include\":[$MATRIX]}" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/ui build
      - run: bun apps/desktop/scripts/build-sidecar.ts
      - run: bun apps/desktop/scripts/build-toolchain.ts
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Kibo ${{ needs.version.outputs.tag }}
          releaseBody: ${{ needs.version.outputs.notes }}
          releaseDraft: true
          prerelease: ${{ needs.version.outputs.alpha == 'true' }}
          uploadUpdaterJson: true
          args: --target ${{ matrix.target }} --verbose
  checksums:
    needs: [version, build]
    permissions: { contents: write }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ needs.version.outputs.tag }}" }
        shell: bash
        run: |
          cp apps/desktop/src-tauri/icons/icon.png icon-512.png
          gh release upload "$TAG" icon-512.png --clobber
          gh release download "$TAG" -D dist --pattern '*'
          rm -f dist/SHA256SUMS dist/install.sh
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release upload "$TAG" dist/SHA256SUMS scripts/install/install.sh --clobber
  publish:
    needs: [version, build, checksums]
    permissions: { contents: write }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ needs.version.outputs.tag }}", ALPHA: "${{ needs.version.outputs.alpha }}" }
        shell: bash
        run: |
          if [ "$ALPHA" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
            gh release view alpha >/dev/null 2>&1 || gh release create alpha --prerelease --latest=false --title "Kibo alpha · canal de mise à jour" --notes "Actifs du canal alpha : latest.json, SHA256SUMS, install.sh. Les paquets sont sur la release de chaque version." --target "$GITHUB_SHA"
            gh release download "$TAG" -D alpha --pattern 'latest.json' --pattern 'SHA256SUMS' --pattern 'install.sh' --pattern 'icon-512.png'
            gh release upload alpha alpha/latest.json alpha/SHA256SUMS alpha/install.sh alpha/icon-512.png --clobber
          else
            gh release edit "$TAG" --draft=false --latest
          fi
