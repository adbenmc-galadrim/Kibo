name: release-cache
on:
  push:
    branches: [main]
    paths: [apps/desktop/src-tauri/**, .github/workflows/release-cache.yml]
  schedule: [{ cron: "0 4 * * 1" }]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "release-cache-${{ github.ref }}", cancel-in-progress: true }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: release-${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/ui build
      - run: bun apps/desktop/scripts/build-sidecar.ts
      - run: bun apps/desktop/scripts/build-toolchain.ts
      - run: bun run --cwd apps/desktop tauri build --target ${{ matrix.target }} --no-bundle --verbose
