name: deploy-remote
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: deploy-remote, cancel-in-progress: false }
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kibo-remote
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/remote-server/Dockerfile
          build-args: KIBO_BUILD_ID=${{ steps.tag.outputs.tag }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: image
    if: ${{ vars.COOLIFY_REMOTE_UUID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_REMOTE_UUID: ${{ vars.COOLIFY_REMOTE_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - name: Déploie l'image sur Coolify
        shell: bash
        run: |
          for name in COOLIFY_URL COOLIFY_TOKEN; do
            if [ -z "${!name}" ]; then echo "$name is not set" >&2; exit 1; fi
          done
          auth=(--header "Authorization: Bearer $COOLIFY_TOKEN" --header "Content-Type: application/json")
          curl --silent --show-error --fail-with-body --request PATCH "${auth[@]}" \
            --data "{\"docker_registry_image_tag\":\"$TAG\"}" \
            "$COOLIFY_URL/api/v1/applications/$COOLIFY_REMOTE_UUID" | jq .
          curl --silent --show-error --fail-with-body --request POST "${auth[@]}" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_REMOTE_UUID&force=false" | jq .
