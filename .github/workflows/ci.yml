name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run --cwd packages/ui build
      - run: bun test packages components
  e2e:
    needs: test
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: cd e2e && bunx playwright install --with-deps chromium
      - run: bun run --cwd packages/ui build
      - run: bun run --cwd e2e test
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-${{ matrix.os }}
          path: e2e/test-results
  desktop-smoke:
    needs: test
    strategy:
      matrix: { os: [ubuntu-22.04, macos-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/ui build
      - run: bun run --cwd apps/desktop build:debug
      - name: smoke
        shell: bash
        timeout-minutes: 2
        run: |
          export KIBO_SMOKE=1 KIBO_HOME=$(mktemp -d) WEBKIT_DISABLE_DMABUF_RENDERER=1
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a apps/desktop/src-tauri/target/debug/kibo; else apps/desktop/src-tauri/target/debug/kibo; fi
          if pgrep -f kibo-daemon; then exit 1; fi
