name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap && sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run --cwd packages/sync-server build
      - name: kibo-sync smoke
        shell: bash
        run: packages/sync-server/dist/kibo-sync invite account --name CI --data "$(mktemp -d)"
      - run: bun run --cwd packages/ui build
      - run: bun run budget
      - run: bun apps/desktop/scripts/cli-smoke.ts
  unit:
    strategy:
      fail-fast: false
      matrix: { group: [daemon, reste] }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap && sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - if: matrix.group == 'daemon'
        run: bun test ./packages/daemon
      - if: matrix.group == 'reste'
        shell: bash
        run: bun test $(ls -d packages/*/ | grep -v '^packages/daemon/$' | sed 's|^|./|') ./components ./scripts
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { KIBO_E2E_THEME: dark }
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap && sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: cd e2e && bunx playwright install --with-deps chromium
      - run: bun run --cwd packages/ui build
      - run: bun run --cwd e2e test
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-ubuntu
          path: e2e/test-results
  desktop-smoke:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-22.04, macos-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/ui build
      - run: bun run --cwd apps/desktop build:debug
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: bun test apps/desktop/scripts
      - name: smoke
        timeout-minutes: 3
        run: bun run --cwd apps/desktop smoke
      - if: runner.os == 'macOS'
        run: bun apps/desktop/scripts/cli-smoke.ts
