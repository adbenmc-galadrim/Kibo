name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run knip
      - run: bun run --cwd packages/ui build
      - run: bun run budget
  unit:
    name: unit (${{ matrix.group }} ${{ matrix.shard }}/${{ matrix.of }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: daemon, shard: 1, of: 4 }
          - { group: daemon, shard: 2, of: 4 }
          - { group: daemon, shard: 3, of: 4 }
          - { group: daemon, shard: 4, of: 4 }
          - { group: reste, shard: 1, of: 3 }
          - { group: reste, shard: 2, of: 3 }
          - { group: reste, shard: 3, of: 3 }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - if: matrix.group == 'daemon'
        run: bun test --shard=${{ matrix.shard }}/${{ matrix.of }} ./packages/daemon
      - if: matrix.group == 'reste'
        shell: bash
        run: bun test --shard=${{ matrix.shard }}/${{ matrix.of }} $(ls -d packages/*/ | grep -v '^packages/daemon/$' | sed 's|^|./|') ./components ./scripts
  e2e:
    name: e2e (${{ matrix.shard }}/5)
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4, 5] }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { KIBO_E2E_THEME: dark }
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: cd e2e && bunx playwright install --with-deps chromium
      - run: bun run --cwd packages/ui build
      - run: bun run --cwd e2e test --shard=${{ matrix.shard }}/5
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-ubuntu-${{ matrix.shard }}
          path: e2e/test-results
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/ui build
      - uses: actions/upload-artifact@v5
        with:
          name: ui-dist
          path: packages/ui/dist
          if-no-files-found: error
  desktop-smoke:
    needs: ui
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-22.04, macos-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-latest' && '12.0' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with: { name: ui-dist, path: packages/ui/dist }
      - run: bun run --cwd apps/desktop build:debug
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features tauri/custom-protocol
      - run: bun test apps/desktop/scripts
      - name: smoke
        timeout-minutes: 3
        run: bun run --cwd apps/desktop smoke
  cli-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: bun packages/cli/src/bin.ts --help
